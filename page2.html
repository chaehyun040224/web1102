<!Doctype html>
<html>
  <meta charset='utf-8'
  <head><title> 리스트에서 자료 선택하기 </title>
  <script>
    function drawImage()
    {
      let sel = document.getElementById('fruits'); //선택리스트 id
      let img = document.getElementById('fimg'); //이미지를 바꿀 이미지 id
      img src = set options[sel.selectedIndex].value;
      //선택한 리스트의 위치의 값으로 img 태그의 src 속성을 변경해라
    }
  </script>
</head>
  <body>
    주제1. 내가 좋아하는 과일 선택 <br>
    <form>
      <select id='fruits' onchange='drawImage()'>
        <option value='apple.png'> 사과 </option>
        <option value='orange.png' selected> 오렌지 </option>
        <option value='watermelon.png'> 수박 </option>
      </select>
      <img id = 'fimg' src='orange.png' alt='설명문' width=100 height=100>
    </form>
    <br>
    주제2. 오늘 점심 메뉴 선택 <br>
    <form>
      <select id='food' onchange='drawImage()'>
        <option value='김밥.png'> 김밥 </option>
        <option value='떡볶이.png' selected> 떡볶이 </option>
        <option value='김치볶음밥.png'> 김치볶음밥 </option>
        <option value='우동.png'> 우동 </option>
        <option value='돈까스.png'> 돈까스 </option>
      </select>
       <img id = 'fimg' src='orange.png' alt='설명문' width=100 height=100>
    </form>
  </body>
</html>
